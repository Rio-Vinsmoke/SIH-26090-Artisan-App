spring.application.name=backend

# =========================================================================
# Server Port (Supports cloud deployment PORT / SERVER_PORT, defaults to 8080)
# =========================================================================
server.port=${PORT:${SERVER_PORT:8080}}

# =========================================================================
# MySQL Database (Supports local MySQL & Cloud Managed MySQL)
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/srishticonnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# =========================================================================
# JPA / Hibernate Configuration
# =========================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================================
# JWT Authentication
# =========================================================================
jwt.secret=${JWT_SECRET:SrishtiConnectSecretKeyForJWTAuthentication2026SecureKey123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================================
# Frontend Origin & CORS Settings
# =========================================================================
frontend.url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =========================================================================
# Google OAuth2 Client Configuration
# =========================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# =========================================================================
# AI Services Configuration (Gemini API)
# =========================================================================
gemini.api.key=${GEMINI_API_KEY:}
ai.removebg.key=${AI_REMOVEBG_KEY:}